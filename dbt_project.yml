
# ============================================================
# PROJECT CONFIGURATION
# ============================================================

name: 'BTC'
version: '1.0.0'
config-version: 2

# dbt profile
profile: 'BTC'

# Project directories
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Directories removed by dbt clean
clean-targets:
  - "target"
  - "dbt_packages"

# ============================================================
# MODEL CONFIGURATIONS
# ============================================================

models:
  BTC:

    # Create a compatibility view pointing to the latest
    # version of versioned models.
    +post-hook:
      - "{{ create_latest_version_view() }}"

    # Staging layer
    staging:
      +materialized: view

    # Marts layer
    marts:
      +materialized: table
