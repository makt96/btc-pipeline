
# Project configuration
name: 'BTC'
version: '1.0.0'
config-version: 2

# dbt profile
profile: 'BTC'

# Project directories
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Directories removed by dbt clean
clean-targets:
  - "target"
  - "dbt_packages"

# Model configurations
models:
  BTC:
    staging:
      +materialized: view

    marts:
      +materialized: table
