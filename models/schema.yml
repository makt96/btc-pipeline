
version: 2

models:
  - name: stg_btc_transactions
    columns:
      - name: transaction_hash
        tests:
          - unique
          - not_null

  # Compare SQL and Python output row counts
  - name: stg_btc_outputs
    tests:
      - dbt_utils.equal_rowcount:
          compare_model: ref('staging_btc_outputs_python')

  # ============================================================
  # WHALE ALERT — VERSIONED MODEL
  # ============================================================

  - name: whale_alert
    latest_version: 2

    # Enforce the model contract across versions
    config:
      contract:
        enforced: true

    # Shared column definitions
    columns:
      - name: output_address
        data_type: string
        data_tests:
          - assert_valid_btc_address

      - name: total_sent
        data_type: float

      - name: transaction_count
        data_type: integer

      - name: total_sent_usd
        data_type: float

    # ==========================================================
    # MODEL VERSIONS
    # ==========================================================

    versions:

      # --------------------------------------------------------
      # VERSION 1 — RETIRED
      # --------------------------------------------------------
      - v: 1
        deprecation_date: "2026-01-01"
        config:
          enabled: false

      # --------------------------------------------------------
      # VERSION 2 — CURRENT VERSION
      # --------------------------------------------------------
      - v: 2
        columns:
          - include: all
            exclude:
              - total_sent_usd
